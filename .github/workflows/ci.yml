name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly: includes slow property tests
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [app, packages/arcade_core, packages/lcd_kit, packages/games/copter, packages/games/snake, packages/games/hop, packages/games/blocks]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Tests (fast)
        if: github.event_name != 'schedule'
        run: flutter test --exclude-tags slow
      - name: Tests (all, incl. slow)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: flutter test

  android-build:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build appbundle --release
