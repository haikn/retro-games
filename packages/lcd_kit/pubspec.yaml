name: lcd_kit
description: Retro monochrome-LCD toolkit shared by the games — pixel buffer, painter, palette, Silkscreen type, LCD widgets, sound, storage and leaderboards.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flame_audio: ^2.12.2
  games_services: ^5.3.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  fonts:
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
        - asset: assets/fonts/Silkscreen-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/Silkscreen-OFL.txt
